body:
  - type: markdown
    attributes:
      value: |
        Ask whether mods work together, share setups that work, or get help putting Full Course in a modpack (tiers for other mods' food, tags and datapack overrides, the keep-vanilla-hunger option, servers). When a reply answers it, mark it as the answer so others can find it.

        If something is broken with another mod, [report a conflict with another mod](https://github.com/Panda-s-Workshop/full-course/issues/new?template=3-mod-conflict.yml) instead.

  - type: textarea
    id: topic
    attributes:
      label: Your question or finding
      placeholder: Does Farmer's Delight food get tiers and buffs?
    validations:
      required: true

  - type: input
    id: mods
    attributes:
      label: The mods, datapacks or modpack involved
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Full Course version
      placeholder: 0.1.0
    validations:
      required: false
