name: Label issues
on:
  issues:
    types: [ opened ]

# the issue forms ask which part of the mod is affected; this turns the answer into an area label
permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            // an issue form's answer is the paragraph under its "### Label" heading
            const answer = (heading) => {
              const match = body.match(new RegExp('^### ' + heading + '[^\\n]*\\n+([^\\n]+)', 'm'));
              return match ? match[1].trim() : null;
            };
            const areas = {
              'No hunger, Recovery and healing': 'area: hunger & healing',
              'Meals, tiers and buffs': 'area: meals & tiers',
              'Kitchen stations (board, pot, oven, crock)': 'area: stations',
              'Dishes, recipes and crops': 'area: dishes & crops',
              'Feasts and cake': 'area: feasts',
              'The Tasting Journal, HUD and tooltips': 'area: journal & HUD',
              'Food from other mods': 'area: compat',
            };
            const labels = [areas[answer('Area')]].filter(Boolean);
            if (labels.length > 0) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: context.payload.issue.number, labels });
            }
