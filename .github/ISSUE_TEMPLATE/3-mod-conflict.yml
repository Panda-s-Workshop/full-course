name: ⚔️ Conflict with another mod
description: Something breaks only together with another mod, datapack or modpack.
labels: ["type: mod conflict", "status: needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        If the game crashes, use the **Crash report** form and mention the other mod there. To ask whether mods work together, use [Discussions › Compatibility & modpacks](https://github.com/Panda-s-Workshop/full-course/discussions/categories/compatibility-modpacks).

  - type: input
    id: other
    attributes:
      label: The other mod or datapack
      description: Its name, version and a link to its page.
      placeholder: Apotheosis 9.0.0, https://www.curseforge.com/minecraft/mc-mods/apotheosis
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What goes wrong?
      description: Screenshots help a lot.
      placeholder: Its foods show the wrong tier, or give no buffs.
    validations:
      required: true

  - type: dropdown
    id: without
    attributes:
      label: Does it happen without the other mod?
      options:
        - "No, only with it"
        - "Yes, it happens without it too"
        - "I haven't tried"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - No hunger, Recovery and healing
        - Meals, tiers and buffs
        - Kitchen stations (board, pot, oven, crock)
        - Dishes, recipes and crops
        - Feasts and cake
        - The Tasting Journal, HUD and tooltips
        - Food from other mods
        - Something else
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Full Course version
      description: From the jar's name or the mods list, such as 0.1.0.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: neoforge
    attributes:
      label: NeoForge version
      description: Full Course is for Minecraft 26.3 on NeoForge and Fabric.
      placeholder: 26.3.0.89
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: The rest of your mod list, or the modpack's name and version.
    validations:
      required: false

  - type: input
    id: log
    attributes:
      label: Log
      description: Upload `logs/latest.log` to [mclo.gs](https://mclo.gs) and paste the link.
      placeholder: https://mclo.gs/...
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the open and closed issues for this mod.
          required: true
