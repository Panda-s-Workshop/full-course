plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    // In the dev runs common's classes and resources (data, assets, the compat test pack) belong to the fullcourse mod
    // itself, not to a library beside it: one module, no split packages.
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(":common").sourceSets.main
        }
    }
}

repositories {
    maven { url = "https://maven.neoforged.net/releases/" }
    // other mods the compat code talks to; only their own group comes from here
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime // dev-run-only mods
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    common(project(path: ":common")) { transitive = false }
    shadowBundle(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }

    // AppleSkin's API, to hide its hunger overlays (the mod runs without it)
    compileOnly "maven.modrinth:appleskin:${rootProject.appleskin_neoforge_version}"
}

// -PfullcourseWithJei and -PfullcourseWithAppleSkin load those mods in the dev runs
if (project.hasProperty("fullcourseWithJei")) {
    dependencies { localRuntime "maven.modrinth:jei:${rootProject.jei_neoforge_version}" }
}
if (project.hasProperty("fullcourseWithAppleSkin")) {
    dependencies { localRuntime "maven.modrinth:appleskin:${rootProject.appleskin_neoforge_version}" }
}

// The run folders stay at the repository root.
loom {
    runs {
        client {
            runDir "../run/client"
            property "neoforge.enabledGameTestNamespaces", "fullcourse"
        }
        server {
            runDir "../run/server"
            programArgs "--nogui"
        }
        // runs every GameTest and exits; non-zero exit when a required test fails
        gameTestServer {
            server()
            name "Game Test Server"
            runDir "../run/gametest"
            mainClass = "net.neoforged.fml.startup.GameTestServer"
            property "neoforge.enableGameTest", "true"
            property "neoforge.enabledGameTestNamespaces", "fullcourse"
            property "fullcourse.compatTest", "true"
        }
    }
}

// NeoForge reads access transformers, not the widener: META-INF/accesstransformer.cfg is generated from common's widener
def accessTransformerDir = layout.buildDirectory.dir("generated/accesstransformer")
def generateAccessTransformer = tasks.register("generateAccessTransformer") {
    def widener = project(":common").file("src/main/resources/fullcourse.accesswidener")
    inputs.file widener
    outputs.dir accessTransformerDir
    doLast {
        def out = accessTransformerDir.get().file("META-INF/accesstransformer.cfg").asFile
        out.parentFile.mkdirs()
        def lines = ["# Generated from common/src/main/resources/fullcourse.accesswidener"] + accessTransformerFor(widener.readLines())
        out.text = lines.join(System.lineSeparator()) + System.lineSeparator()
    }
}
sourceSets.main.resources.srcDir(generateAccessTransformer)

// access transformer lines for access widener lines: accessible is public; extendable and mutable also drop final
static List<String> accessTransformerFor(List<String> widener) {
    def out = []
    widener.each { line ->
        def parts = line.replaceAll(/#.*/, "").trim().split(/\s+/)
        if (parts.length < 3 || parts[0] == "accessWidener") return
        def modifier = parts[0] == "accessible" ? "public" : "public-f"
        def owner = parts[2].replace("/", ".")
        switch (parts[1]) {
            case "class": out << "${modifier} ${owner}".toString(); break
            case "method": out << "${modifier} ${owner} ${parts[3]}${parts[4]}".toString(); break
            case "field": out << "${modifier} ${owner} ${parts[3]}".toString(); break
        }
    }
    return out
}

processResources {
    def props = ["minecraft_version", "minecraft_version_range", "neoforge_version", "mod_name", "mod_description",
                 "mod_license", "mod_version", "mod_authors", "mod_id"].collectEntries { [(it): rootProject.property(it)] }
    inputs.properties props
    filesMatching("META-INF/neoforge.mods.toml") {
        expand props
    }
}

// the released jar: common and NeoForge classes together (nothing to remap since 26.1)
shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "neoforge"
}

jar {
    archiveClassifier = "dev"
}

assemble.dependsOn shadowJar
