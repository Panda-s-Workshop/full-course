plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    // the dev runs' mod is both modules: Fabric Loader only looks for the access widener and data in the mod's own paths
    mods {
        main {
            sourceSet sourceSets.main
            sourceSet project(":common").sourceSets.main
        }
    }

    // run folders beside the NeoForge ones at the repository root
    runs {
        client {
            runDir "../run/fabric-client"
        }
        server {
            runDir "../run/fabric-server"
            programArgs "--nogui"
        }
    }
}

repositories {
    // other mods the compat code talks to; only their own group comes from here
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime // dev-run-only mods
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    api("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}") { exclude group: "net.fabricmc", module: "fabric-loader" }

    common(project(path: ":common")) { transitive = false }
    shadowBundle(project(path: ":common", configuration: "transformProductionFabric")) { transitive = false }

    // AppleSkin's API, to hide its hunger overlays (the mod runs without it)
    compileOnly "maven.modrinth:appleskin:${rootProject.appleskin_fabric_version}"
}

// -PfullcourseWithJei, -PfullcourseWithAppleSkin, -PfullcourseWithFarmersDelight and -PfullcourseWithCookingForBlockheads
// load those mods in the dev runs
if (project.hasProperty("fullcourseWithJei")) {
    dependencies { localRuntime "maven.modrinth:jei:${rootProject.jei_fabric_version}" }
}
if (project.hasProperty("fullcourseWithAppleSkin")) {
    dependencies { localRuntime "maven.modrinth:appleskin:${rootProject.appleskin_fabric_version}" }
}
if (project.hasProperty("fullcourseWithFarmersDelight")) {
    dependencies { localRuntime "maven.modrinth:farmers-delight-refabricated:${rootProject.farmers_delight_fabric_version}" }
}
if (project.hasProperty("fullcourseWithCookingForBlockheads")) {
    dependencies {
        localRuntime "maven.modrinth:cooking-for-blockheads:${rootProject.cfb_fabric_version}"
        localRuntime "maven.modrinth:balm:${rootProject.balm_fabric_version}"
    }
}

processResources {
    def props = [
        version: project.version,
        mod_id: rootProject.mod_id,
        mod_name: rootProject.mod_name,
        mod_description: rootProject.mod_description,
        mod_license: rootProject.mod_license,
        mod_authors: rootProject.mod_authors,
        minecraft_version: rootProject.minecraft_version,
        fabric_loader_version: rootProject.fabric_loader_version,
        fabric_api_min: rootProject.fabric_api_min
    ]
    inputs.properties props
    filesMatching("fabric.mod.json") {
        expand props
    }
}

// the released jar: common and Fabric classes together (nothing to remap since 26.1)
shadowJar {
    exclude "architectury.common.json"
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "fabric"
}

jar {
    archiveClassifier = "dev"
}

assemble.dependsOn shadowJar
